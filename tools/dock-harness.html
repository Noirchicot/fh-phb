<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FH dock harness</title>
<!-- Offline bench for the Companion dock. Lives in tools/ because mkdocs build
     wipes site/ every time; copy it into site/ after each build:
       cp tools/dock-harness.html site/dock-harness.html
     Serve with preview_start on the fh-site-b entry of .claude/launch.json. -->
<!-- Cache-busted: without this the browser keeps serving the stylesheet from the
     last build and a CSS fix looks like it did nothing. -->
<script>document.write('<link rel="stylesheet" href="/stylesheets/companion-dock.css?v='+Date.now()+'">');</script>
<script>document.write('<link rel="stylesheet" href="/stylesheets/companion-tarot.css?v='+Date.now()+'">');</script>
<style>body{margin:0;background:#2b2419;min-height:100vh;font-family:-apple-system,Helvetica,Arial,sans-serif}
  .note{color:#c9b98c;font-size:12px;padding:12px;max-width:40ch;line-height:1.5}</style>
</head>
<body>
<p class="note">Dock harness — the Companion runs against a stubbed Worker.</p>
<div id="fhPlayerSheet" data-rules="/"></div>
<script>
(function(){
  var BUILD={build:{
    meta:{class:"Wizard",level:5,species:"Human"},
    character:{name:"Harness",abilityScores:{STR:10,DEX:14,CON:13,INT:18,WIS:12,CHA:9}},
    nativeSkillTiers:{Arcana:"expert",History:"proficient",Vigilance:"proficient",Insight:"proficient","Tool - Soulforging":"proficient"},
    destiny:{score:8,arcana:{name:"The Hermit"}}
  }};
  var PROFILE={profile:{ddbLinked:false,snapshot:null,levelUps:[],preparation:{transferEssence:false,identify:false,tools:[]}}};
  /* A live campaign feed, in memory. Two other players are already at the
     table so the TABLE view has something to show offline, and anything this
     dock posts is appended -- so a roll made here comes back through the same
     path it would take in a real campaign. Sequences mimic the Worker's:
     13-digit epoch ms plus a tiebreaker, which is what makes them sortable. */
  var FEED_SEQ=Date.now()-60000;
  function feedSeq(){FEED_SEQ+=1;var s=String(FEED_SEQ);while(s.length<13)s="0"+s;return s+"-aaaa";}
  function seed(character,pseudo,title,total,outcome,parts,badges){
    return {seq:feedSeq(),event:{schema:"fh-event/1",id:"seed-"+title,ts:new Date().toISOString(),
      campaign:"FH1",actor:{pseudo:pseudo,character:character,ddbCharacterId:null},type:"roll",
      rollId:"seed-"+title,rev:0,display:{schema:"fh-roll/1",title:title,total:total,outcome:outcome,
      parts:parts,badges:badges,dc:null},intent:null}};
  }
  var FEED=[
    seed("Brakka","Mara","Athletics",19,"Success",[{k:"d20",v:"14"},{k:"Athletics",v:"+5"}],[]),
    seed("Ilyra","Wen","Perception",27,"Natural 20",[{k:"d20 (adv)",v:"9 / 20 → 20"},{k:"Perception",v:"+7"}],["NATURAL 20"])
  ];
  window.fetch=function(url,options){
    var path=String(url),method=(options&&options.method)||"GET";
    if(/\/feed\//.test(path)){
      if(method==="POST"){
        var posted=JSON.parse(options.body);
        posted.ts=new Date().toISOString();
        FEED.push({seq:feedSeq(),event:posted});
        return Promise.resolve({ok:true,status:200,json:function(){return Promise.resolve({ok:true});}});
      }
      var since=(path.split("since=")[1]||"").split("&")[0];
      var rows=FEED.filter(function(row){return !since||row.seq>decodeURIComponent(since);});
      return Promise.resolve({ok:true,status:200,json:function(){return Promise.resolve({
        schemaVersion:1,lookbackMs:5000,
        cursor:rows.length?rows[rows.length-1].seq:decodeURIComponent(since||""),
        events:rows.map(function(row){return row.event;})});}});
    }
    if(/\/table\//.test(path)){
      // No table server in the harness by default, so the stream zone starts
      // RECENT — matching a real campaign between sessions. To see LIVE/OFF,
      // point this at a real `node table-server.mjs` (plan §12a) and swap
      // live:true + a real url in temporarily; never commit that swap.
      return Promise.resolve({ok:true,status:200,json:function(){return Promise.resolve({live:false});}});
    }
    var body= /\/profile\//.test(path) ? PROFILE
      : /\/party\/[^/]+\/[^/]+/.test(path) ? BUILD
      : /\/party\//.test(path) ? {builds:[{pseudo:"Harness"}]}
      : /\/inv\//.test(path) ? {items:[]}
      : {};
    return Promise.resolve({ok:true,status:200,json:function(){return Promise.resolve(body);}});
  };
  try{
    localStorage.setItem("fh-my-campcode","FH1");
    localStorage.setItem("fh-my-pseudo","Harness");
    localStorage.setItem("fh-cd-open","1");
    // A clean slate by default -- but that also wipes every panel's persisted
    // store, which makes "does my panel survive a reload?" untestable. Load
    // /dock-harness.html?keep to reload without the wipe.
    if(!/[?&]keep\b/.test(location.search))localStorage.removeItem("fh-player-v2:FH1:Harness");
  }catch(error){}
})();
</script>
<script>
// Same order as mkdocs.yml: the data globals must exist before the dock reads them.
["chaos-tables","arcana",
 "fh-panel-traits","fh-panel-actions","fh-panel-spells","fh-panel-gear","fh-panel-craft","fh-panel-notes",
 "fh-static-dice","fh-player-sheet"].forEach(function(name){
  document.write('<scr'+'ipt src="/javascripts/'+name+'.js?v='+Date.now()+'"><\/scr'+'ipt>');
});
</script>
</body>
</html>
