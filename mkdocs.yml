site_name: Fate's Hand — Player's Handbook
site_description: The Fate's Hand 5+ house rules — an expansion of D&D 2024.
site_url: https://noirchicot.github.io/fh-phb/
# ⛔ VERBATIM — NE PAS REFORMULER, NE RIEN AJOUTER.
# La déclaration exigée par le SRD 5.2.1, en DEUX phrases, reprise telle quelle
# depuis `fh-srd/exports/srd/en/*.json` (champ `attribution`, 315 signes). Le
# dépôt source la teste caractère par caractère contre le PDF à chaque
# exécution ; une paraphrase ici casserait cette garantie en silence.
# 🔴 Et la page légale continue : « Veuillez n'inclure AUCUNE AUTRE attribution
#    à Wizards ». Donc pas de « changes were made », pas d'avertissement de
#    non-affiliation, rien autour. Ce qui est permis, verbatim : « compatible
#    with fifth edition » / « 5E compatible ».
# 📌 Elle est ici et nulle part ailleurs : `sync_from_vault.py` ne l'écrit plus
#    dans les blocs (voir ATTR_PAR_BLOC). Si cette ligne disparaît, la remettre
#    à True le même jour.
copyright: >-
  This work includes material from the System Reference Document 5.2.1 (“SRD 5.2.1”) by Wizards of the Coast LLC, available at https://www.dndbeyond.com/srd. The SRD 5.2.1 is licensed under the Creative Commons Attribution 4.0 International License, available at https://creativecommons.org/licenses/by/4.0/legalcode.

theme:
  name: material
  language: en
  custom_dir: overrides
  favicon: assets/img/favicon.png
  icon:
    logo: material/dice-d20
  font: false   # use self-hosted PHB-clone fonts from extra.css
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css
  - stylesheets/companion-dock.css
  - stylesheets/companion-tarot.css

extra_javascript:
  - javascripts/fh-widget.js
  - javascripts/fh-home.js
  - javascripts/fh-sky.js
  # Generated by sync_from_vault.py; must load before the dock, which reads
  # window.FH_CHAOS to quote a Chaos row instead of linking to the chapter.
  - javascripts/chaos-tables.js
  - javascripts/arcana.js
  # Belt panels register themselves onto window.FH.panels. Order between them
  # is irrelevant (each carries its own `order`), and the dock reads the list
  # at render time, so these only need to be present — not loaded first.
  - javascripts/fh-panel-traits.js
  - javascripts/fh-panel-actions.js
  - javascripts/fh-panel-spells.js
  - javascripts/fh-panel-gear.js
  - javascripts/fh-panel-craft.js
  - javascripts/fh-panel-notes.js
  # Progressive WebGL renderer for d6/d20 results. It never rolls; the dock
  # passes it faces that have already been resolved by the FHPC state machine.
  - javascripts/fh-static-dice.js
  - javascripts/fh-player-sheet.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - callouts
  - search

# ── Les douze pages d'espèce ne sont PAS dans la nav, et c'est voulu ────────
# `chapters/species.md` EST leur menu : douze entrées de plus dans la barre
# latérale (déjà en `navigation.expand`) doubleraient la section « Creating a
# Character » pour un chemin que la page-menu offre déjà, avec le portrait et
# le blurb en prime. On le DÉCLARE ici plutôt que de laisser mkdocs le
# signaler à chaque build — un avertissement permanent est un avertissement
# qu'on cesse de lire.
not_in_nav: |
  chapters/species/*.md
  chapters/classes/*.md
  chapters/arcana/*.md
  chapters/major-arcana.md

nav:
  # ══ REFONTE 2026-08-20 — quatre menus racine, deux côtés ═══════════════
  # Le joueur a QUATRE cartes (le carré 2×2 de la garde) ; le MJ a sa
  # sous-page derrière la serrure, avec sa propre World. Une page peut
  # vivre des deux côtés. Plan : `FH-WEB/FHPHB/FHPHB arborescence.md`.
  - Welcome: index.md
  - Rules Reference: rules.md
  - Build a Character:
    - Build a Character: builder.md
    - 1 · Identity: chapters/identity.md
    - 2 · Species: chapters/species.md
    - 3 · Inheritance: chapters/inheritance.md
    - 4 · Destiny & Arcana: chapters/fates-hand-mechanic.md
    - 5 · Class: chapters/classes.md
    - Moonkeeper: chapters/moonkeeper.md
    - College of Banners: chapters/college-of-banners.md
    - Silent Blade: chapters/silent-blade.md
    - Spell Rigger: chapters/spell-rigger.md
    - 6 · Abilities: chapters/ability-scores.md
    - 7 · Skills: chapters/skills-and-tools.md
    - 8 · Equipment: chapters/equipment.md
  - At the Table:
    - Player Companion: player.md
    - Leveling up: chapters/leveling-up.md
    - Feats: chapters/feats.md
    - Trainings: chapters/trainings.md
    - Ability Score Roller: dice-roller.md
    - Synergies: chapters/skills-synergies.md
    - Combat & Battlefield: chapters/battlefield.md
    - Exploration: chapters/dungeoneering.md
    - Rules Glossary: chapters/rules-glossary.md
  - Magic & Soulforging:
    - Magic: chapters/magic.md
    - Spells: chapters/spells.md
    - Dark Rituals: chapters/dark-rituals.md
    - Crafting: chapters/crafting.md
    - Soulforging Rules: chapters/soulforge-crafting.md
    - Party Inventory: inventory.md
    - Soulforge Workshop: soulforge.md
    - Magic Items: chapters/magic-items.md
  - World:
    - Primordial Forces: chapters/primordial-forces.md
  - The Dungeon Masters' Secrets:
    - The Vault: dm.md
    - Chaos Tables: chapters/chaos-tables.md
    # Déplacé du parcours joueur le 2026-08-20 sur ordre d'Eric : « déplace le
    # chapitre — dans le DM vault ». La lecture des 22 est au MJ ; le joueur
    # découvre une carte en la tirant. ⏳ Un teaser de 3 cartes est prévu côté
    # joueur — lesquelles n'est pas tranché, donc il n'est pas posé.
  - The Bible:
    # Squelette posé le 2026-09-02 (lot plomberie), rempli le 2026-09-02 (lot
    # contenu) : 310 règles atomiques + 21 contradictions. Source = dépôt `fhpc`
    # (`ui/builder/NORMES.md`, `CADRES.md`, `SOCLE.md`), PAS le vault — décision
    # d'architecte du 2026-09-02. Cette page est un TIRAGE ; on ne la corrige
    # jamais ici, on corrige la source puis on synchronise (spec en fin de
    # rapport du lot plomberie).
    # `Les lois` est la couche AU-DESSUS des 310 règles : une trentaine de phrases
    # qui les résument et les citent. Elle est en PREMIER parce que c'est la page
    # qu'Eric lit d'abord, et souvent la seule. Elle ne tranche rien : une loi qui
    # passe sur une zone disputée renvoie à `À trancher`.
    - Les lois: bible/lois.md
    - Comment lire: bible/index.md
    # ① ce qui vaut partout · ② par catégorie · ③ par objet (design · mesures ·
    # fonctions) · ④ par section. Arborescence dictée par Eric le 2026-09-03 et
    # posée par le lot 141 : ⛔ ne pas re-aplatir en menu de onze pages.
    - Les règles générales:
      - Les règles générales: bible/general/index.md
      - Le panneau: bible/general/panneau.md
      - Les cadres: bible/general/cadres.md
      - Le budget: bible/general/budget.md
      - Les listes: bible/general/listes.md
      - L'écriture: bible/general/ecriture.md
      - Les gestes: bible/general/gestes.md
      - Le socle: bible/general/socle.md
    - Les commandes:
      - Les commandes: bible/commandes/index.md
      - Le bouton:
        - Le bouton: bible/commandes/bouton/index.md
        - Design: bible/commandes/bouton/design.md
        - Mesures: bible/commandes/bouton/mesures.md
        - Fonctions: bible/commandes/bouton/fonctions.md
        # ⓐ lot 142 : les règles qui NOMMENT un bouton sortent de `fonctions.md`,
        # qui redevient la loi générale. ⛔ Aucune ancre renommée : un déplacement
        # reste un déplacement (310 règles avant, 310 après).
        - Boutons spéciaux: bible/commandes/bouton/speciaux.md
      - L'interrupteur: bible/commandes/interrupteur.md
      - Le dropdown: bible/commandes/dropdown.md
    - Les porteurs:
      - Les porteurs: bible/porteurs/index.md
      - Le jeton: bible/porteurs/jeton.md
      - Le collecteur: bible/porteurs/collecteur.md
      - La saisie: bible/porteurs/saisie.md
    - Les portes:
      - Les portes: bible/portes/index.md
      - Le popup: bible/portes/popup.md
      - L'aide « ? »: bible/portes/aide.md
      - Le livre: bible/portes/livre.md
    - Les signaux:
      - Les signaux: bible/signaux/index.md
      - Le voyant: bible/signaux/voyant.md
    - La conduite:
      - La conduite: bible/conduite/index.md
      - La ceinture: bible/conduite/ceinture.md
      - Le menu latéral: bible/conduite/rail.md
      - Le chevron: bible/conduite/chevron.md
    # ④ ÉCRITES au lot 142 : 80 règles d'écran tirées des MESSAGES DE COMMIT du dépôt
    # `fhpc`, du logbook et des commentaires de code — ⚠️ AUCUNE ne vient du corpus des
    # 310 (NORMES/CADRES/SOCLE), qui reste à 310 exactement. La Bible compte donc 390
    # règles au total : 310 de corpus + 80 de section. Chaque page ne porte que
    # l'EXCEPTION de son écran, et rien n'y est tranché.
    - Les sections:
      - Les sections: bible/sections/index.md
      - Le Menu: bible/sections/menu.md
      - 1 · Identity: bible/sections/1-identity.md
      - 2 · Species: bible/sections/2-species.md
      - 3 · Inheritance: bible/sections/3-inheritance.md
      - 4 · Destiny & Arcana: bible/sections/4-destiny.md
      - 5 · Class: bible/sections/5-class.md
      - 6 · Abilities: bible/sections/6-abilities.md
      - 7 · Skills & Tools: bible/sections/7-skills.md
      - 8 · Equipment: bible/sections/8-equipment.md
      - La feuille: bible/sections/sheet.md
    - À trancher: bible/a-trancher.md
  - SRD 5.2.1: https://noirchicot.github.io/fh-srd/
