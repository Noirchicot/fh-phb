site_name: Fate's Hand — Player's Handbook
site_description: The Fate's Hand 5+ house rules — an expansion of D&D 2024.
docs_dir: docs

theme:
  name: material
  language: en
  icon:
    logo: material/dice-d20
  font: false   # use self-hosted PHB-clone fonts from extra.css
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/fh-home.js
  - javascripts/fh-sky.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - callouts
  - search

nav:
  - Welcome: index.md
  - Creating a Character:
    - Rolling Ability Scores: chapters/ability-scores.md
    - Backgrounds: chapters/backgrounds.md
    - Species: chapters/species.md
    - Skills & Tools: chapters/skills-and-tools.md
    - Feats: chapters/feats.md
  - The Destiny System:
    - Destiny System: chapters/fates-hand-mechanic.md
    - Arcana: chapters/major-arcana.md
    - Chaos Tables: chapters/chaos-tables.md
  - Playing the Game:
    - Synergies: chapters/skills-synergies.md
    - Battlefield: chapters/battlefield.md
    - Dungeoneering: chapters/dungeoneering.md
    - Spells: chapters/spells.md
    - Soulforge Crafting: chapters/soulforge-crafting.md
  - Classes & Subclasses:
    - Class Modifications: chapters/classes.md
    - Lunar Sorcerer: chapters/lunar-sorcerer.md
  - Tools:
    - 5.5 Sheet → 5+ Converter: builder.md
    - Soulforge Workshop: soulforge.md
