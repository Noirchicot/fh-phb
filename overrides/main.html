{% extends "base.html" %}

{% block extrahead %}
  {# Social cards: link previews on Discord, iMessage, etc. #}
  {% set title = page.title ~ " - " ~ config.site_name if page and page.title and not page.is_homepage else config.site_name %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ config.site_description }}">
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta property="og:image" content="{{ config.site_url }}assets/img/og-card.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ title }}">
  <meta name="twitter:description" content="{{ config.site_description }}">
  <meta name="twitter:image" content="{{ config.site_url }}assets/img/og-card.jpg">
{% endblock %}
