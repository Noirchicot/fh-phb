<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FH Static Dice Lab</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#07101b;color:#f4ead8}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 20%,#15243a,#07101b 66%)}
    main{width:min(520px,100%);display:grid;gap:18px}
    header{display:flex;justify-content:space-between;align-items:end;gap:12px}
    h1{margin:0;color:#d9b35b;font:600 18px Georgia,serif;letter-spacing:.08em;text-transform:uppercase}
    #fhLabResult{margin:0;color:#f4ead8;font:700 15px Georgia,serif}
    .tray{height:260px;display:grid;place-items:center;overflow:hidden;background:#121827;border:1px solid #9d783a;border-radius:14px;box-shadow:inset 0 1px rgba(255,255,255,.04),0 18px 55px rgba(0,0,0,.45)}
    #fhLabDie{display:grid;place-items:center;width:150px;height:150px}
    .fh-cd-static3d{position:relative;display:block;width:var(--fh-static-die-size);height:var(--fh-static-die-size)}
    .fh-cd-static3d canvas{display:none;width:100%;height:100%;filter:drop-shadow(0 13px 12px rgba(0,0,0,.62))}
    .fh-cd-static3d.is-webgl canvas{display:block}
    .fh-cd-static3d-result{position:absolute;z-index:2;left:50%;top:50%;display:block;min-width:1.35em;transform:translate(-50%,-47%) scale(.7);opacity:0;font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:calc(var(--fh-static-die-size) * .36);font-weight:700;line-height:1;text-align:center;text-shadow:0 1px rgba(255,255,255,.18);transition:opacity .16s ease,transform .2s ease}
    .fh-cd-static3d[data-sides="20"] .fh-cd-static3d-result{font-size:calc(var(--fh-static-die-size) * .31)}
    .fh-cd-static3d.is-settled .fh-cd-static3d-result{transform:translate(-50%,-47%) scale(1);opacity:1}
    .fh-cd-static3d-fallback{display:grid;place-items:center;width:100%;height:100%;color:#58180d;background:#f3ead6;border:3px solid #8a6a2a;border-radius:18px;font:700 44px Georgia,serif}
    .fh-cd-static3d.is-webgl .fh-cd-static3d-fallback{display:none}
    nav{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px}
    button{min-height:44px;color:#eadbbf;background:#101a28;border:1px solid #65543b;border-radius:7px;font-weight:700;cursor:pointer}
    button[aria-pressed="true"]{color:#271b07;background:#d9ae54;border-color:#f0cc77}
    #fhLabRoll{color:#271b07;background:#d9ae54;border-color:#f0cc77}
    small{color:#9aa5b4;text-align:center}
  </style>
</head>
<body>
  <main>
    <header><h1>Static Dice Lab</h1><p id="fhLabResult">d20 · ready</p></header>
    <section class="tray" aria-label="Fate's Hand static dice tray"><div id="fhLabDie"></div></section>
    <nav aria-label="Die controls">
      <button type="button" data-sides="6" aria-pressed="false">d6</button>
      <button type="button" data-sides="20" aria-pressed="true">d20</button>
      <button type="button" id="fhLabRoll">ROLL</button>
    </nav>
    <small>The die rotates in place. The result is chosen before the animation begins.</small>
  </main>
  <script src="javascripts/fh-static-dice.js"></script>
  <script>
    (function(){
      "use strict";
      var sides=20,host=document.getElementById("fhLabDie"),result=document.getElementById("fhLabResult");
      function randomFace(max){
        if(window.crypto&&crypto.getRandomValues){
          var values=new Uint32Array(1),limit=Math.floor(0x100000000/max)*max;
          do{crypto.getRandomValues(values);}while(values[0]>=limit);
          return values[0]%max+1;
        }
        return Math.floor(Math.random()*max)+1;
      }
      function roll(){
        var face=randomFace(sides);
        result.textContent="d"+sides+" · "+face;
        host.innerHTML='<span class="fh-cd-static3d" data-sides="'+sides+'" data-result="'+face+'" data-material="ivory" data-index="0" data-animate="1" style="--fh-static-die-size:150px" role="img" aria-label="d'+sides+' result '+face+'"><canvas aria-hidden="true"></canvas><b class="fh-cd-static3d-result" aria-hidden="true">'+face+'</b><span class="fh-cd-static3d-fallback">'+face+'</span></span>';
        window.FHStaticDice.mount(host);
      }
      document.querySelectorAll("[data-sides]").forEach(function(button){
        button.addEventListener("click",function(){
          sides=Number(button.dataset.sides);
          document.querySelectorAll("[data-sides]").forEach(function(item){item.setAttribute("aria-pressed",String(item===button));});
          roll();
        });
      });
      document.getElementById("fhLabRoll").addEventListener("click",roll);
      roll();
    }());
  </script>
</body>
</html>
